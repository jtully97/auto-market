# Local stack: Postgres, Mailpit (catches all email), migrations, API, worker, web.
#   cp .env.example .env && docker compose up --build
# Web:      http://localhost:3000
# API:      http://localhost:4000
# Mailpit:  http://localhost:8025
#
# For hot-reload development run only the infrastructure in Docker:
#   docker compose up -d db mailpit && pnpm dev

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://automarket:automarket@db:5432/automarket
  SMTP_URL: smtp://mailpit:1025
  STORAGE_DRIVER: local
  LOCAL_STORAGE_DIR: /data/uploads
  COOKIE_SECURE: 'false'

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: automarket
      POSTGRES_PASSWORD: automarket
      POSTGRES_DB: automarket
    ports: ['${DB_PORT:-5434}:5432'] # 5434 avoids clashing with a locally installed Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U automarket']
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://automarket:automarket@db:5432/automarket
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [.env]
    environment:
      <<: *api-env
      PORT: '4000'
      SERVICE_NAME: automarket-api
    ports: ['4000:4000']
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ['node', 'dist/worker.js']
    env_file: [.env]
    environment:
      <<: *api-env
      PORT: '4001'
      SERVICE_NAME: automarket-worker
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:4000
      PORT: '3000'
    ports: ['3000:3000']
    depends_on: [api]

volumes:
  pgdata:
  uploads:
