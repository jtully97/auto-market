name: Deploy

# Reusable deploy to Google Cloud Run. Auth uses Workload Identity Federation
# (no JSON keys). Configure per GitHub Environment (staging / production):
#   vars:  GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA,
#          GCP_ARTIFACT_REPO (e.g. automarket), NAME_PREFIX (e.g. automarket-staging)
# Production should require a reviewer in the GitHub Environment settings.

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      version: { type: string, required: true }
      ref: { type: string, required: true }
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      version: { type: string, required: true, description: 'Version to deploy, e.g. 1.4.0' }
      ref: { type: string, required: true, description: 'Git ref, e.g. v1.4.0' }

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency: deploy-${{ inputs.environment }}
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}
      PREFIX: ${{ vars.NAME_PREFIX }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/api:${{ env.VERSION }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          tags: ${{ env.REGISTRY }}/migrate:${{ env.VERSION }}
          cache-from: type=gha,scope=api

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/web:${{ env.VERSION }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Run database migrations
        run: |
          gcloud run jobs update "$PREFIX-migrate" --region ${{ vars.GCP_REGION }} --image "$REGISTRY/migrate:$VERSION" --quiet
          gcloud run jobs execute "$PREFIX-migrate" --region ${{ vars.GCP_REGION }} --wait

      - name: Deploy worker
        run: |
          gcloud run deploy "$PREFIX-worker" --region ${{ vars.GCP_REGION }} --image "$REGISTRY/api:$VERSION" \
            --update-labels version=${VERSION//./-} --quiet

      - name: Deploy API
        run: |
          gcloud run deploy "$PREFIX-api" --region ${{ vars.GCP_REGION }} --image "$REGISTRY/api:$VERSION" \
            --update-labels version=${VERSION//./-} --quiet

      - name: Deploy web
        run: |
          gcloud run deploy "$PREFIX-web" --region ${{ vars.GCP_REGION }} --image "$REGISTRY/web:$VERSION" \
            --update-labels version=${VERSION//./-} --quiet

      - name: Smoke test
        run: |
          API_URL=$(gcloud run services describe "$PREFIX-api" --region ${{ vars.GCP_REGION }} --format='value(status.url)')
          curl --fail --retry 5 --retry-delay 5 "$API_URL/readyz"
